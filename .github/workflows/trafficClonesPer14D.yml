name: Update clone traffic graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clone-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Download clone statistics
        env:
          CLONES_TOKEN: ${{ secrets.CLONES_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data assets

          curl --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CLONES_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/traffic/clones" \
            > data/clones.json

      - name: Create or update PNG graphs
        run: |
          python <<'PY'
          import json
          import os
          import matplotlib.pyplot as plt

          with open("data/clones.json", "r") as file:
              data = json.load(file)

          clone_data = data.get("clones", [])

          dates = [item["timestamp"][:10] for item in clone_data]
          total_clones = [item["count"] for item in clone_data]
          special_clones = [item["uniques"] for item in clone_data]

          os.makedirs("assets", exist_ok=True)

          def create_graph(values, title, filename, color):
              plt.figure(figsize=(12, 6))

              plt.plot(
                  dates,
                  values,
                  marker="o",
                  linewidth=2,
                  color=color
              )

              plt.title(title)
              plt.xlabel("Date")
              plt.ylabel("Number of clones")
              plt.xticks(rotation=45)
              plt.grid(True, alpha=0.3)
              plt.tight_layout()

              plt.savefig(
                  filename,
                  dpi=150,
                  bbox_inches="tight"
              )

              plt.close()

          create_graph(
              total_clones,
              "Repository Clones - Last 14 Days",
              "assets/clones_trafic.png",
              "#2ea44f"
          )

          create_graph(
              special_clones,
              "Unique Clones - Last 14 Days",
              "assets/special_clones_trafic.png",
              "#0969da"
          )
          PY

      - name: Commit or update graph files
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            assets/clones_trafic.png
            assets/special_clones_trafic.png
          message: "Update clone traffic graphs"
