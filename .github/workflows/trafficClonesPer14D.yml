name: Update clone traffic graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clone-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Download clone statistics
        env:
          CLONES_TOKEN: ${{ secrets.tafic_updater }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p data assets

          if [ -z "${CLONES_TOKEN:-}" ]; then
            echo "The tafic_updater secret is missing or unavailable."
            exit 1
          fi

          echo "Downloading clone statistics..."

          curl --fail-with-body --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CLONES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/traffic/clones" \
            -o data/clones.json

          test -s data/clones.json

      - name: Create dark-background PNG graphs
        run: |
          python <<'PY'
          import json
          import os
          import matplotlib.pyplot as plt

          with open("data/clones.json", "r") as file:
              data = json.load(file)

          clone_data = data.get("clones", [])

          dates = [item["timestamp"][:10] for item in clone_data]
          total_clones = [item["count"] for item in clone_data]
          unique_clones = [item["uniques"] for item in clone_data]

          os.makedirs("assets", exist_ok=True)

          def create_graph(values, title, filename, color):
              figure, axis = plt.subplots(figsize=(12, 6))

              background_color = "#181818"

              figure.patch.set_facecolor(background_color)
              axis.set_facecolor(background_color)

              axis.plot(
                  dates,
                  values,
                  marker="o",
                  linewidth=2,
                  color=color
              )

              axis.set_title(title, color="white")
              axis.set_xlabel("Date", color="white")
              axis.set_ylabel("Number of clones", color="white")

              axis.tick_params(
                  axis="x",
                  colors="white",
                  labelrotation=45
              )

              axis.tick_params(
                  axis="y",
                  colors="white"
              )

              for spine in axis.spines.values():
                  spine.set_color("#555555")

              axis.grid(
                  True,
                  color="#555555",
                  alpha=0.5
              )

              figure.tight_layout()

              figure.savefig(
                  filename,
                  dpi=150,
                  bbox_inches="tight",
                  facecolor=figure.get_facecolor()
              )

              plt.close(figure)

          create_graph(
              total_clones,
              "Repository Clones - Last 14 Days",
              "assets/clones_traffic.png",
              "#2ea44f"
          )

          create_graph(
              unique_clones,
              "Unique Clones - Last 14 Days",
              "assets/unique_clones_traffic.png",
              "#0969da"
          )
          PY

      - name: Commit or update graph files
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            assets/clones_traffic.png
            assets/unique_clones_traffic.png
          message: "Update clone traffic graphs"
