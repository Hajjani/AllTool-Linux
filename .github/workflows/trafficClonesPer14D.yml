name: Test clone traffic token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-token:
    runs-on: ubuntu-latest

    steps:
      - name: Test GitHub token and traffic API
        env:
          CLONES_TOKEN: ${{ secrets.tafic_updater }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${CLONES_TOKEN:-}" ]; then
            echo "FAIL: tafic_updater secret is empty or unavailable."
            exit 1
          fi

          echo "Secret is loaded."
          echo "Repository: ${REPOSITORY}"

          echo
          echo "Testing token authentication..."

          USER_STATUS=$(curl -sS \
            -o /tmp/user-response.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CLONES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user")

          echo "Authentication HTTP status: ${USER_STATUS}"

          if [ "${USER_STATUS}" != "200" ]; then
            echo "FAIL: GitHub rejected the token."
            cat /tmp/user-response.json
            exit 1
          fi

          echo "Token authentication succeeded."

          echo
          echo "Testing repository access..."

          REPOSITORY_STATUS=$(curl -sS \
            -o /tmp/repository-response.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CLONES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}")

          echo "Repository HTTP status: ${REPOSITORY_STATUS}"

          if [ "${REPOSITORY_STATUS}" != "200" ]; then
            echo "FAIL: Token cannot access ${REPOSITORY}."
            cat /tmp/repository-response.json
            exit 1
          fi

          echo "Repository access succeeded."

          echo
          echo "Testing clone traffic access..."

          TRAFFIC_STATUS=$(curl -sS \
            -o /tmp/traffic-response.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${CLONES_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/traffic/clones")

          echo "Traffic API HTTP status: ${TRAFFIC_STATUS}"

          if [ "${TRAFFIC_STATUS}" != "200" ]; then
            echo "FAIL: Token cannot access clone traffic."
            cat /tmp/traffic-response.json
            exit 1
          fi

          echo "SUCCESS: Token, repository access, and clone traffic access all work."
