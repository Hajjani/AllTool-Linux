[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alltool"
version = "2.0.0"
description = "Modular Linux CLI tool suite with 20+ utilities"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "packaging>=24.0",
]
[project.scripts]
alltool = "Tools:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Tools*"]

[tool.setuptools.package-dir]
"Tools" = "Tools"